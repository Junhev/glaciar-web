<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ficha técnica · GlaciAR</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--sans:'Space Grotesk',system-ui,sans-serif;--serif:'Source Serif 4',Georgia,serif;--ink:#0f1b2d;--mut:#5d7183;--bg:#f4f7fa;--card:#fff;--line:#dbe5ec;--steel:#2f7ea8;--pri:#0f1b2d;--onpri:#fff;--tint:#e9f2f8;--err:#b3261e;--errbg:#fdecea;--ok:#1b7a3d;--okbg:#e6f4ea;--warn:#a85d00;--warnbg:#fff3df;--sh:0 1px 2px rgba(15,27,45,.06),0 6px 18px rgba(15,27,45,.05)}
@media (prefers-color-scheme:dark){:root{--ink:#e8f0f6;--mut:#8da3b5;--bg:#0b141d;--card:#111f2b;--line:#223648;--steel:#5fb0d6;--pri:#5fb0d6;--onpri:#06202e;--tint:#16303f;--err:#ff8a80;--errbg:#3a1a1a;--ok:#7fd69a;--okbg:#14301f;--warn:#f0b35a;--warnbg:#3a2a10;--sh:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
header h2{flex:1;margin:0;font-size:1.05rem;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.15rem}.brand b{color:var(--steel)}.brand svg{color:var(--steel)}
main{max-width:680px;margin:0 auto;padding:20px 16px 56px}
.mut,.meta{color:var(--mut);font-size:.92rem;margin:4px 0}
label{display:block;font-size:.82rem;font-weight:500;color:var(--mut);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-height:44px}
textarea{min-height:84px;resize:vertical;font-family:var(--serif)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px color-mix(in srgb,var(--steel) 22%,transparent)}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;border:1px solid var(--pri);border-radius:10px;padding:10px 18px;min-height:44px;background:var(--pri);color:var(--onpri);cursor:pointer;margin-top:16px;text-decoration:none}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.6}
button.ghost{background:none;border-color:transparent;color:var(--steel);margin:0;padding:8px 10px;min-height:40px}
button.del{background:none;color:var(--err);border-color:var(--err);margin-left:8px}
a{color:var(--steel)}
a.btn,label.btn{display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:.95rem;border:1px solid var(--line);border-radius:10px;padding:9px 16px;min-height:42px;background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer;margin:10px 8px 0 0;box-shadow:var(--sh)}
a.btn:hover,label.btn:hover{border-color:var(--steel)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:var(--sh)}
.eqhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.eqhead h2,.eqhead h3{margin:0;font-size:1.2rem;font-weight:700}
.badge{font-size:.8rem;font-weight:600;padding:3px 11px;border-radius:99px;background:var(--okbg);color:var(--ok);white-space:nowrap}.badge.off{background:var(--errbg);color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}.chip{font-size:.85rem;padding:2px 10px;border-radius:8px;background:var(--tint)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 16px}
.tile{border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--card)}
.tile span{display:block;font-size:.82rem;color:var(--mut)}.tile b{font-size:1.5rem;font-weight:700}.tile p{margin:6px 0 0}
.tile.err{background:var(--errbg);border-color:transparent}.tile.err b{color:var(--err)}
.tile.warn{background:var(--warnbg);border-color:transparent}.tile.warn b{color:var(--warn)}
.tile.okk{background:var(--okbg);border-color:transparent}.tile.okk b{color:var(--ok)}
.vis{position:relative;border-left:2px solid var(--line);margin:0 0 0 6px;padding:0 0 14px 18px;font-family:var(--serif);font-size:1.02rem;line-height:1.45}
.vis::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--steel);border:2px solid var(--card)}
.vis small,.vis .mut{font-family:var(--sans);color:var(--mut);font-size:.86rem}
.vis small:first-child,.vis .d{font-weight:700;color:var(--steel);font-family:var(--sans);font-size:.86rem}
b.debe,.debe{color:var(--err);font-family:var(--sans)}.ok{color:var(--ok);font-family:var(--sans);font-weight:600}
h1{font-size:1.7rem;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em}h3{font-size:1rem;margin:22px 0 8px;font-weight:700}
h4{margin:28px 0 6px;font-size:.95rem;font-weight:700}
.err{color:var(--err);min-height:1.2em;margin:8px 0 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;color:var(--ink);margin-top:16px}.chk input{width:22px;height:22px;min-height:0}
.box{max-width:400px;margin:9vh auto 0;padding:32px 28px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.box .brand{font-size:1.6rem}.box .sub{color:var(--mut);margin:4px 0 8px}.box button{width:100%}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0 0;min-height:64px;box-shadow:var(--sh)}
.item:hover{border-color:var(--steel);filter:none}.item div{min-width:0;flex:1}
.item .avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--steel);font-style:normal;font-weight:700}
.item b{display:block;font-weight:600}
.item span{display:block;color:var(--mut);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span.debe{color:var(--err);font-weight:600;font-family:var(--sans)}
.item.pend{border-left:5px solid #e08a00}
.card.nuevo{border-left:6px solid #e08a00;background:rgba(224,138,0,.12)}.card.nuevo.urg{border-left-color:#c62828;background:rgba(198,40,40,.14)}
.tag{display:inline-block;font-style:normal;font-size:.75rem;font-weight:700;padding:1px 9px;border-radius:99px;background:#b36b00;color:#fff;margin-right:8px}.tag.urg{background:#c62828}
details{margin:16px 0 0;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--steel);padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";display:inline-block;width:1.2em;font-weight:700}
details[open]>summary::before{content:"–"}
details.mini{margin:6px 0 0;padding-top:4px;border-top:0}details.mini summary{font-weight:500;font-size:.85rem;color:var(--mut)}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.f{position:relative}.f img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.x{position:absolute;top:4px;right:4px;margin:0;padding:0;width:24px;height:24px;min-height:0;border-radius:50%;background:rgba(0,0,0,.65);border-color:transparent;color:#fff}
.tabs{max-width:680px;margin:0 auto;display:flex;gap:4px;padding:0 16px}
.tabs button{margin:0;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mut);min-height:42px;padding:8px 14px}
.tabs button.on{color:var(--steel);border-bottom-color:var(--steel)}.tabs button:hover{filter:none;color:var(--ink)}
.pills{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.pills button{margin:0;min-height:36px;padding:6px 14px;background:var(--card);color:var(--ink);border-color:var(--line)}
.pills button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.job select{margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const sb = supabase.createClient(
  'https://kscqvfnolitxbhfccagf.supabase.co',
  'sb_publishable_jTWYlXZEocDG88PM_fnSSg_62XFAha9'
);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = (f, n) => { const v = f.elements[n].value.trim(); return v === '' ? null : v; };
const fmt = d => d ? d.split('-').reverse().join('/') : '—';
const hoy = () => new Date().toLocaleDateString('en-CA');

const LOGO = '<svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="16" r="14"/><path d="M16 7v18M8.2 11.5l15.6 9M23.8 11.5l-15.6 9"/></svg>';
const CHEV = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>';
const ini = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
function barra(titulo, volver, tab) {
  const tabs = isAdm() && !volver ? `<nav class="tabs">${[['c', 'Clientes', 'clientes()'], ['t', 'Trabajos', 'trabajos()'], ['e', 'Equipo', 'equipo()']].map(([k, n, f]) => `<button class="${tab === k ? 'on' : ''}" onclick="${f}">${n}</button>`).join('')}</nav>` : '';
  return `<header><div class="hin">${volver ? `<button class="ghost" onclick="${volver}">${CHEV}Volver</button>` : `<span class="brand">${LOGO}Glaci<b>AR</b></span>`}<h2>${esc(titulo)}</h2><button class="ghost" onclick="salir()">Salir</button></div>${tabs}</header>`;
}

let ME = null, PERF = {}, CTX = null, PEDS = [], PRE = null, TF = 'pendiente';
const isAdm = () => !!ME && ME.rol === 'admin';
const tec = v => (v.tecnico_id && PERF[v.tecnico_id]) ? PERF[v.tecnico_id].nombre : '';
const TT = ['Mantenimiento', 'Instalación', 'Reparación', 'Diagnóstico', 'Carga de gas', 'Otro'];

async function init() {
  const { data } = await sb.auth.getSession();
  data.session ? iniciar(data.session.user.id) : login();
}

async function iniciar(uid) {
  const { data: me } = await sb.from('perfiles').select('*').eq('id', uid).maybeSingle();
  if (!me || !me.activo) {
    ME = null;
    app.innerHTML = barra('Acceso') + '<main><div class="card"><h3>Tu usuario todavía no tiene acceso</h3><p class="meta">Pedile al administrador que lo habilite.</p></div></main>';
    return;
  }
  ME = me;
  const r = await sb.from('perfiles').select('id,nombre,rol,activo');
  PERF = Object.fromEntries((r.data || []).map(p => [p.id, p]));
  isAdm() ? clientes() : misTrabajos();
}

function login() {
  app.innerHTML = `<main class="box"><div class="brand">${LOGO}Glaci<b>AR</b></div><p class="sub">Ficha técnica de clientes</p>
  <form id="f"><label>Email<input name="email" type="email" required autocomplete="username"></label>
  <label>Contraseña<input name="pw" type="password" required autocomplete="current-password"></label>
  <p class="err" id="err"></p><button>Entrar</button></form></main>`;
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    const { data, error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.pw.value });
    if (error) { document.getElementById('err').textContent = 'No se pudo entrar: ' + error.message; return; }
    iniciar(data.user.id);
  };
}

async function salir() { await sb.auth.signOut(); ME = null; login(); }

async function clientes() {
  CTX = null;
  const { data, error } = await sb.from('clientes').select('id,nombre,telefono,direccion').order('nombre');
  if (error) { app.innerHTML = barra('Clientes', null, 'c') + `<main><p class="err">${esc(error.message)}</p></main>`; return; }
  const dv = (await sb.from('cobros').select('monto,pagado,visitas(equipos(cliente_id))')).data || [], deuda = {};
  dv.forEach(v => { const k = v.visitas && v.visitas.equipos && v.visitas.equipos.cliente_id; if (k) deuda[k] = (deuda[k] || 0) + debe(v); });
  PEDS = (await sb.from('pedidos').select('id,created_at,tipo,mensaje,urgente,clientes(id,nombre)').eq('estado', 'nuevo').order('urgente', { ascending: false }).order('created_at', { ascending: false })).data || [];
  const pe = PEDS, conPedido = {};
  pe.forEach(p => { if (p.clientes) conPedido[p.clientes.id] = (conPedido[p.clientes.id] === 'urg' || p.urgente) ? 'urg' : 'nuevo'; });
  const total = Object.values(deuda).reduce((a, b) => a + Math.max(0, b), 0);
  app.innerHTML = barra('Clientes', null, 'c') + `<main>
  ${total > 0 || pe.length ? `<div class="tiles">${total > 0 ? `<div class="tile err"><span>Te deben</span><b>${$m(total)}</b></div>` : ''}${pe.length ? `<div class="tile warn"><span>Pedidos nuevos</span><b>${pe.length}</b></div>` : ''}</div>` : ''}
  ${pe.length ? `<h4>Pedidos nuevos (${pe.length})</h4>` + pe.map(p => `<div class="card nuevo${p.urgente ? ' urg' : ''}"><em class="tag${p.urgente ? ' urg' : ''}">${p.urgente ? 'Urgente' : 'Nuevo'}</em><b>${esc(p.clientes ? p.clientes.nombre : 'Cliente')}</b> · ${esc(p.tipo)}<br><small>${new Date(p.created_at).toLocaleString('es-AR')}</small>${p.mensaje ? `<p>${esc(p.mensaje)}</p>` : ''}${p.clientes ? `<button type="button" onclick="crearDesdePedido(${p.id})">Crear trabajo</button><button type="button" class="ghost" onclick="cliente(${p.clientes.id})">Ver cliente</button>` : ''}<button type="button" class="ghost" onclick="resolver(${p.id})">Marcar como resuelto</button></div>`).join('') : ''}
  <input id="q" type="search" placeholder="Buscar por nombre, teléfono o dirección">
  <div id="list"></div>
  <details open><summary>Nuevo cliente</summary>
  <form onsubmit="addCliente(event)">
    <label>Nombre<input name="nombre" required></label>
    <div class="row"><label>Teléfono<input name="telefono" type="tel"></label>
    <label>Dirección<input name="direccion"></label></div>
    <label>Notas<textarea name="notas"></textarea></label>
    <button>Guardar cliente</button></form></details>
  <button type="button" class="ghost" onclick="exportar()">Exportar todo a Excel (respaldo)</button></main>`;
  const list = document.getElementById('list');
  const pintar = () => {
    const q = document.getElementById('q').value.toLowerCase();
    const r = data.filter(c => [c.nombre, c.telefono, c.direccion].join(' ').toLowerCase().includes(q));
    list.innerHTML = r.length ? r.map(c => `<button class="item${conPedido[c.id] ? ' pend' : ''}" onclick="cliente(${c.id})"><i class="avatar">${esc(ini(c.nombre))}</i><div><b>${esc(c.nombre)}${conPedido[c.id] ? ` <em class="tag${conPedido[c.id] === 'urg' ? ' urg' : ''}">${conPedido[c.id] === 'urg' ? 'Urgente' : 'Pedido nuevo'}</em>` : ''}</b><span>${esc([c.telefono, c.direccion].filter(Boolean).join(' · '))}</span>${deuda[c.id] > 0 ? `<span class="debe">Debe ${$m(deuda[c.id])}</span>` : ''}</div></button>`).join('')
      : '<p class="meta">Todavía no hay clientes. Cargá el primero abajo.</p>';
  };
  document.getElementById('q').oninput = pintar;
  pintar();
}

async function addCliente(e) {
  e.preventDefault();
  const f = e.target;
  const { data, error } = await sb.from('clientes').insert({ nombre: val(f, 'nombre'), telefono: val(f, 'telefono'), direccion: val(f, 'direccion'), notas: val(f, 'notas') }).select('id').single();
  if (error) return alert(error.message);
  cliente(data.id);
}

const CF=['nombre','telefono','direccion','notas'],EF=['marca','modelo','tipo','frigorias','gas','fecha_instalacion','ultimo_mantenimiento'],VF=['fecha','trabajo_hecho','pendiente','notas','repuestos','temp_ambiente','temp_salida'],MF=['costo_repuestos','monto','pagado'];
const datos=(f,l)=>Object.fromEntries(l.map(n=>[n,val(f,n)]));
const opt=(l,v)=>'<option value="">—</option>'+l.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
const campos={
  cliente:c=>`<label>Nombre<input name="nombre" required value="${esc(c.nombre)}"></label><div class="row"><label>Teléfono<input name="telefono" type="tel" value="${esc(c.telefono)}"></label><label>Dirección<input name="direccion" value="${esc(c.direccion)}"></label></div><label>Notas<textarea name="notas">${esc(c.notas)}</textarea></label>`,
  equipo:q=>`<div class="row"><label>Marca<input name="marca" value="${esc(q.marca)}"></label><label>Modelo<input name="modelo" value="${esc(q.modelo)}"></label></div><div class="row"><label>Tipo<select name="tipo">${opt(['Split','Inverter','Ventana','Portátil','Otro'],q.tipo)}</select></label><label>Frigorías<input name="frigorias" type="number" inputmode="numeric" min="0" value="${esc(q.frigorias)}"></label></div><div class="row"><label>Gas<select name="gas">${opt(['R410A','R32','R22','Otro'],q.gas)}</select></label><label>Instalación<input name="fecha_instalacion" type="date" value="${esc(q.fecha_instalacion)}"></label></div><label>Último mantenimiento (reinicia la garantía)<input name="ultimo_mantenimiento" type="date" value="${esc(q.ultimo_mantenimiento)}"></label>`,
  visita:(v,adm)=>`<label>Fecha<input name="fecha" type="date" required value="${esc(v.fecha)}"></label><label>Trabajo hecho<textarea name="trabajo_hecho" required>${esc(v.trabajo_hecho)}</textarea></label><label>Qué falta o recomiendo<input name="pendiente" value="${esc(v.pendiente)}"></label><div class="row"><label>Temp. ambiente, sensor unidad interior (°C)<input name="temp_ambiente" type="number" inputmode="decimal" step="any" value="${esc(v.temp_ambiente)}"></label><label>Temp. de salida unidad interior (°C)<input name="temp_salida" type="number" inputmode="decimal" step="any" value="${esc(v.temp_salida)}"></label></div><label>Notas<input name="notas" value="${esc(v.notas)}"></label><label>Repuestos usados<input name="repuestos" value="${esc(v.repuestos)}"></label>${adm ? `<div class="row"><label>Costo de repuestos ($)<input name="costo_repuestos" type="number" inputmode="decimal" min="0" step="any" value="${esc(v.costo_repuestos)}"></label><label>Monto a cobrar ($)<input name="monto" type="number" inputmode="decimal" min="0" step="any" value="${esc(v.monto)}"></label></div><label>Pagado ($)<input name="pagado" type="number" inputmode="decimal" min="0" step="any" value="${esc(v.pagado)}"></label>` : ''}`
};

const $m = n => '$' + Number(n || 0).toLocaleString('es-AR');
const debe = v => (Number(v.monto) || 0) - (Number(v.pagado) || 0);
function cobro(v) {
  const l = [];
  if (v.temp_ambiente != null || v.temp_salida != null) {
    const t = [];
    if (v.temp_ambiente != null) t.push(`Ambiente ${v.temp_ambiente} °C`);
    if (v.temp_salida != null) t.push(`Salida unidad interior ${v.temp_salida} °C`);
    if (v.temp_ambiente != null && v.temp_salida != null) t.push(`diferencia ${Math.round((v.temp_ambiente - v.temp_salida) * 10) / 10} °C`);
    l.push(t.join(' · '));
  }
  if (v.repuestos || v.costo_repuestos) l.push(`Repuestos: ${esc(v.repuestos || '')}${v.costo_repuestos ? ' (costo ' + $m(v.costo_repuestos) + ')' : ''}`);
  if (v.monto != null || v.pagado != null) { const d = debe(v); l.push(`Cobro ${$m(v.monto)} · Pagado ${$m(v.pagado)} · ` + (d > 0 ? `<b class="debe">Debe ${$m(d)}</b>` : 'Saldado')); }
  return l.length ? '<br><small>' + l.join('<br>') + '</small>' : '';
}
function wa(t) {
  let d = String(t).replace(/\D/g, '').replace(/^0+/, '');
  if (!d.startsWith('54')) d = '54' + (d.startsWith('9') ? '' : '9') + d;
  return 'https://wa.me/' + d;
}
async function exportar() {
  const wb = XLSX.utils.book_new();
  for (const [t, o] of [['clientes', 'id'], ['equipos', 'id'], ['visitas', 'id'], ['cobros', 'visita_id'], ['trabajos', 'id'], ['perfiles', 'created_at']]) {
    const { data, error } = await sb.from(t).select('*').order(o);
    if (error) return alert(error.message);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), t);

function garantia(f) {
  if (!f) return null;
  const [y, m, d] = f.split('-').map(Number);
  const h = new Date(); h.setHours(0, 0, 0, 0);
  const left = 15 - Math.round((h - new Date(y, m - 1, d)) / 864e5);
  if (left > 0) return { txt: `Día(s) de garantía: ${left} día(s)`, cls: '' };
  if (left === 0) return { txt: 'Garantía: vence hoy', cls: '' };
  return { txt: 'Garantía vencida', cls: 'off' };
}

function reducir(file) {
  return new Promise((ok, mal) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => b ? ok(b) : mal(new Error('No se pudo procesar la foto')), 'image/jpeg', 0.8);
    };
    img.onerror = () => mal(new Error('No se pudo leer la foto'));
    img.src = URL.createObjectURL(file);
  });
}

async function subir(inp, eid, cid) {
  const files = [...inp.files];
  if (!files.length) return;
  inp.parentElement.firstChild.textContent = 'Subiendo…';
  for (const fl of files) {
    try {
      const blob = await reducir(fl), path = `${eid}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
      const u = await sb.storage.from('fotos').upload(path, blob, { contentType: 'image/jpeg' });
      if (u.error) throw u.error;
      const r = await sb.from('fotos').insert({ equipo_id: eid, path });
      if (r.error) throw r.error;
    } catch (err) { alert(err.message); break; }
  }
  cliente(cid);
}

    <label>Nombre<input name="nombre" required value="${esc(p.nombre)}"></label>
    <div class="row"><label>Rol<select name="rol"${yo ? ' disabled' : ''}><option value="tecnico"${p.rol === 'tecnico' ? ' selected' : ''}>Técnico</option><option value="admin"${p.rol === 'admin' ? ' selected' : ''}>Administrador</option></select></label>
    <label class="chk"><input type="checkbox" name="activo"${p.activo ? ' checked' : ''}${yo ? ' disabled' : ''}> Con acceso</label></div>
    <button>Guardar</button></form>
    ${yo ? '' : `<details class="mini"><summary>Restablecer contraseña</summary><form onsubmit="claveEmpleado(event,'${p.id}')"><label>Nueva contraseña (mínimo 8 caracteres)<input name="password" required minlength="8" autocomplete="off"></label><button>Cambiar contraseña</button></form></details>`}</div>`; }).join('')}
  ${claveHtml()}</main>`;
}

let ULTIMO = null;
const genClave = () => Array.from(crypto.getRandomValues(new Uint8Array(10)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');

async function llamarEmpleados(body) {
  const { data, error } = await sb.functions.invoke('crear-empleado', { body });
  if (error) {
    let m = 'No se pudo conectar con el servidor. Revisá que la función esté publicada.';
    try { m = (await error.context.json()).error || m; } catch (e) { /* queda el mensaje general */ }
    throw new Error(m);
  }
  return data;
}

async function nuevoEmpleado(e) {
  e.preventDefault();
  const f = e.target, err = document.getElementById('ne');
  err.textContent = '';
  const d = { accion: 'crear', nombre: f.nombre.value.trim(), email: f.email.value.trim(), password: f.password.value, rol: f.rol.value };
  try { await llamarEmpleados(d); ULTIMO = d; equipo(); } catch (x) { err.textContent = x.message; }
}

async function claveEmpleado(e, id) {
  e.preventDefault();
  try { await llamarEmpleados({ accion: 'clave', id, password: e.target.password.value }); alert('Contraseña actualizada. Pasásela al empleado.'); equipo(); } catch (x) { alert(x.message); }
}

async function copiarAcceso() {
  const t = `Entrá a ${new URL('ficha.html', location.href).href}\nUsuario: ${ULTIMO ? ULTIMO.email : ''}\nContraseña: ${ULTIMO ? ULTIMO.password : ''}`;
  try { await navigator.clipboard.writeText(t); alert('Datos copiados'); } catch (e) { prompt('Copiá estos datos:', t); }
}

function claveHtml() {
  return `<details><summary>Cambiar mi contraseña</summary><form onsubmit="miClave(event)"><label>Nueva contraseña (mínimo 8 caracteres)<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><button>Guardar contraseña</button></form></details>`;
}

async function miClave(e) {
  e.preventDefault();
  const { error } = await sb.auth.updateUser({ password: e.target.password.value });
  if (error) return alert(error.message);
  alert('Contraseña actualizada.');
  e.target.reset();
}

async function upPerfil(e, id) {
  e.preventDefault();
  const f = e.target, d = { nombre: f.nombre.value.trim() };
  if (!f.rol.disabled) { d.rol = f.rol.value; d.activo = f.activo.checked; }
  const { error } = await sb.from('perfiles').update(d).eq('id', id);
  if (error) return alert(error.message);
  equipo();
}

init();
</script>
